<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>PlantPulse Command Center</title>
  <link rel="icon" href="data:," />
  <meta name="description" content="Predictive maintenance & OEE command center on Snowflake (public demo mode on synthetic data)" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.css" />
  <style>
    body { margin: 0; background: #ffffff; font-family: "Source Sans Pro", Segoe UI, Arial, sans-serif; }
    #boot { position: fixed; inset: 0; z-index: 2147483000; display: flex; flex-direction: column; align-items: center;
            justify-content: center; text-align: center; padding: 16px; box-sizing: border-box;
            background: linear-gradient(135deg, #0D3B5C 0%, #11567F 55%, #1a86bd 100%); color: #fff; transition: opacity .4s; }
    #boot.done { opacity: 0; pointer-events: none; }
    #boot .logo { width: 64px; height: 64px; border-radius: 16px; background: #29B5E8; display: flex; align-items: center;
                  justify-content: center; font-size: 34px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
    #boot h1 { font-size: 30px; margin: 0 0 6px; font-weight: 800; }
    #boot p { color: #cfe3ee; margin: 4px 0; max-width: 560px; font-size: 15px; }
    #boot .spin { width: 40px; height: 40px; margin: 22px auto 10px; border-radius: 50%; border: 4px solid rgba(255,255,255,.2);
                  border-top-color: #29B5E8; animation: r .9s linear infinite; }
    #boot .bar { width: 280px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; margin-top: 8px; }
    #boot .bar i { display: block; height: 100%; width: 0; background: #29B5E8; border-radius: 3px; transition: width .8s; }
    #boot small { color: #9fd8f0; font-size: 13px; margin-top: 10px; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="boot">
    <div class="logo">&#10052;&#xFE0E;</div>
    <h1>PlantPulse Command Center</h1>
    <p>Loading the live demo in your browser&hellip; this takes about 20&ndash;30 seconds on first visit.</p>
    <div class="spin"></div>
    <div class="bar"><i id="bootbar"></i></div>
    <small id="bootmsg">Starting the Python runtime</small>
    <p style="margin-top:22px;font-size:13px">Public demo on synthetic data &middot; the production version runs as Streamlit in Snowflake.</p>
  </div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@0.85.1/build/stlite.js";
    const u = (p) => new URL(p, window.location.href).href;
    const data = ["assets", "failure_events", "maintenance_docs", "production_log", "sensor_readings", "spare_parts", "work_orders"];
    const files = {
      "app/streamlit_app.py": { url: u("app/streamlit_app.py") },
      "app/local_engine.py": { url: u("app/local_engine.py") },
      "app/architecture.png": { url: u("app/architecture.png") },
    };
    for (const d of data) files[`data/${d}.csv`] = { url: u(`data/${d}.csv`) };
    mount({
      requirements: ["plotly"], entrypoint: "app/streamlit_app.py", files,
      streamlitConfig: { "theme.primaryColor": "#11567F", "theme.secondaryBackgroundColor": "#F4F7FA", "theme.font": "sans serif" },
    }, document.getElementById("root"));
    const steps = [[3000, 25, "Installing packages"], [9000, 55, "Loading 207,000 sensor readings"],
                   [16000, 80, "Scoring 24 assets"], [24000, 92, "Rendering the command center"]];
    for (const [t, w, m] of steps) setTimeout(() => {
      if (!document.getElementById("boot").classList.contains("done")) {
        document.getElementById("bootbar").style.width = w + "%"; document.getElementById("bootmsg").textContent = m; } }, t);
    const ready = setInterval(() => {
      if (document.querySelector(".st-key-nav") && document.querySelectorAll(".pp-kpi").length) {
        clearInterval(ready); document.getElementById("bootbar").style.width = "100%";
        setTimeout(() => { const b = document.getElementById("boot"); b.classList.add("done"); setTimeout(() => b.remove(), 500); }, 300);
      }
    }, 400);
  </script>
</body>
</html>
